[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sekhmet-red"
version = "0.1.0"
description = "Evidence-first security scanner and red-team benchmark for MCP servers and AI agent tools."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Dr. Ahmed Mohamed El Sayed" }]
keywords = ["mcp", "ai-security", "agent-security", "prompt-injection", "red-team"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.scripts]
sekhmet = "sekhmet_red.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sekhmet_red"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

